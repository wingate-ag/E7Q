[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e7q"
version = "0.16.0.dev0"
description = "Experimental invariant-aware quantum programming and verification language"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
license = {text = "Apache-2.0"}
authors = [{name = "Alexander Gregory Wingate"}]

[project.scripts]
e7q = "e7q.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
